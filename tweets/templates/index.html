
{% extends "layout.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<section class="hero-section">

    <div class="container">

        <div class="row align-items-center min-vh-100 flex-column-reverse flex-lg-row">

            <!-- Left Side -->

            <div class="col-lg-6">

                <h1 class="hero-title">
                    Welcome To <br>
                    Our Tweet
                </h1>

                <p class="hero-subtitle">
                    Express Your Thoughts.
                    Connect With Everyone.
                </p>

                <a href="{% url 'tweet_list' %}" class="btn explore-btn">
                    Explore Tweets
                </a>

            </div>

            <!-- Right Side -->
            {% load static %}
            <div class="col-lg-6 text-center">

                    <div class="circle"></div>

                    <img src="{% static 'images/hero.svg' %}"
                    class="hero-image"
                    alt="Hero">
            </div>

        </div>

    </div>

</section>

{% endblock %}
