{% extends "layout.html" %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row align-items-center min-vh-100">

            <!-- Left Side -->

            <div class="col-lg-6 text-center">

                <div class="login-image">

                    <div class="glow-circle"></div>

                    <img src="{% static 'images/login.svg' %}"
                         class="img-fluid floating-img"
                         alt="Login">

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-6">

                <div class="login-card">

                    <h1 class="login-title">
                        Welcome Back!
                    </h1>

                    <p class="login-text">
                        Login to continue your journey with Our Tweet.
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label">
                                Username
                            </label>

                            {{ form.username }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            {{ form.password }}

                        </div>

                        <button class="btn login-submit w-100">

                            Login

                        </button>

                    </form>

                    <p class="register-link mt-4">

                        Don't have an account?

                        <a href="{% url 'register' %}">
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
